[project]
name = "control-tower"
version = "0.1.0"
description = "MillTech FinCrime Control Tower: a supervisor deep agent over the three FSI hackathon projects"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7",
    "langchain>=1.0,<2",
    "langgraph>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langsmith>=0.4",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["control_tower"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
