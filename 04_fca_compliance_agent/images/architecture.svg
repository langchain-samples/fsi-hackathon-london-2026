<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-label="FCA Compliance Agent architecture. Reviews start in the ReguLens web UI, Studio chat or the command line, pass through an inbound adapter into one compliance core (triage, per-unit analysis, report and summary), then an optional human gate, then an outbound adapter. The core reaches the language model, the FCA Handbook and the Consumer Credit Act 1974 only through ports."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6C82"/></marker></defs><rect width="1920" height="1080" fill="#FFFFFF"/>
