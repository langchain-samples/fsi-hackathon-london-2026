[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fca-compliance-agent"
version = "0.1.0"
description = "Hexagonal LangGraph agent for FCA Handbook & Consumer Credit Act compliance analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langgraph>=1.0,<2",
    "langchain>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-anthropic>=1.0,<2",
    "pypdf>=6,<7",
    "reportlab>=4,<5",
    "pydantic>=2,<3",
    "python-dotenv>=1.0,<2",
    "typing-extensions>=4.10",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2.3,<3",
]
# The FCA Handbook RAG in handbook_rag/, which runs as a separate MCP server
handbook-rag = [
    "fastembed>=0.9,<0.10",
    "mcp>=2.3,<3",
    "qdrant-client>=1.17,<2",
]
dev = [
    "pytest>=8",
]

[project.scripts]
fca-regulatory-mcp = "fca_compliance_agent.mcp_server.server:main"
fca-compliance-api = "fca_compliance_agent.adapters.http_api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fca_compliance_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
