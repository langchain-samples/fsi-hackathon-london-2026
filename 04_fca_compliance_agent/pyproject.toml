[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fca-compliance-agent"
version = "0.1.0"
description = "Hexagonal LangGraph agent for FCA Handbook & Consumer Credit Act compliance analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2",
    "langchain>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-anthropic>=1.0,<2",
    "pydantic>=2,<3",
    "python-dotenv>=1.0,<2",
    "typing-extensions>=4.10",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0",
]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fca_compliance_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
