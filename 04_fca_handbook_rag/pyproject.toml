[project]
name = "fca-handbook-rag"
version = "0.1.0"
description = "Retrieval over the FCA Handbook with Qdrant, for agents that check pull requests against FCA rules"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "python-dotenv>=1.0,<2",
    "pydantic>=2,<3",
    "qdrant-client>=1.17,<2",
    "fastembed>=0.9,<0.10",
    "mcp>=2.3,<3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
