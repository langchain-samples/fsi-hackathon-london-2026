# One environment for all three topics. Run `uv sync --all-packages` here, in the repo root, to install everything
# into .venv. Each topic keeps its own pyproject.toml, which lists that topic's dependencies.
[project]
name = "fsi-hackathon"
version = "1.0.0"
description = "FSI hackathon workshop"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["01_kyc_agent", "02_transaction_monitoring_agent", "03_document_summary_agent"]
